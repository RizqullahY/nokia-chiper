<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nokia Chiper</title>
    <!-- THIS IS TAILWIND --WATCH -->
    <link rel="stylesheet" href="./css/output.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body class="bg-gradient-to-r from-gray-900 to-gray-700 text-white">
    <header class="py-6 shadow-lg bg-gray-800">
      <div class="container mx-auto flex justify-between items-center px-6">
        <h1 class="text-3xl font-extrabold text-white">Nokia Chiper</h1>
      </div>
    </header>

    <main
      class="flex flex-col justify-center items-center min-h-screen text-center p-6"
    >
      <div class="text-center mb-8">
        <h2 class="text-6xl font-extrabold text-white leading-tight mb-4">
          NOKIA CHIPER
        </h2>
        <p class="text-lg text-white mb-6">Encrypt | Decrypt</p>
        <div class="space-x-4">
          <a
            href="#encrypt"
            class="bg-gray-600 text-white px-6 py-3 rounded-full text-xl font-semibold hover:bg-gray-700 transition-all"
            >Encrypt</a
          >
          <a
            href="#decrypt"
            class="bg-gray-600 text-white px-6 py-3 rounded-full text-xl font-semibold hover:bg-gray-700 transition-all"
            >Decrypt</a
          >
        </div>
      </div>
      <div class="image-container">
        <img src="./src/img/nokia.png" alt="Nokia Phone" class="" />
      </div>
      </main>

    <section class="py-4 lg:px-48 hidden md:block">
      <div id="mapping"></div>
    </section>

    <section class="p-4 grid grid-cols-1 md:grid-cols-1 gap-8 lg:px-48">
      <!-- Encryption Section -->
      <div id="encrypt" class="bg-gray-800 p-6 rounded-lg mb-8">
        <h3 class="text-4xl text-white text-center mb-4">Encryption</h3>
        <div
          class="flex flex-col lg:flex-row items-center justify-between gap-4"
        >
          <textarea
            id="encryptInput"
            class="w-full lg:w-1/2 h-24 lg:h-32 p-4 bg-gray-600 text-white rounded-lg mb-4 lg:mb-0"
            placeholder="INPUT"
          ></textarea>

          <div class="relative w-full lg:w-1/2">
            <textarea
              id="encryptOutput"
              class="w-full h-24 lg:h-32 p-4 bg-gray-600 text-white rounded-lg"
              placeholder="OUTPUT"
              readonly
            ></textarea>
            <button
              onclick="copyToClipboard('encryptOutput')"
              class="absolute top-2 right-2 bg-gray-700 hover:bg-gray-500 text-white p-2 rounded-lg"
            >
              📋
            </button>
          </div>
        </div>
      </div>

      <!-- Decryption Section -->
      <div id="decrypt" class="bg-gray-800 p-6 rounded-lg mb-8">
        <h3 class="text-4xl text-white text-center mb-4">Decryption</h3>
        <div
          class="flex flex-col lg:flex-row items-center justify-between gap-4"
        >
          <textarea
            id="decryptInput"
            class="w-full lg:w-1/2 h-24 lg:h-32 p-4 bg-gray-600 text-white rounded-lg mb-4 lg:mb-0"
            placeholder="INPUT"
          ></textarea>

          <div class="relative w-full lg:w-1/2">
            <textarea
              id="decryptOutput"
              class="w-full h-24 lg:h-32 p-4 bg-gray-600 text-white rounded-lg"
              placeholder="OUTPUT"
              readonly
            ></textarea>
            <button
              onclick="copyToClipboard('decryptOutput')"
              class="absolute top-2 right-2 bg-gray-700 hover:bg-gray-500 text-white p-2 rounded-lg"
            >
              📋
            </button>
          </div>
        </div>
      </div>
    </section>

    <div class="p-5 md:p-15 lg:p-28">
      <div class="p-10 bg-white rounded">
        <div id="disqus_thread"></div>
        <script>
          (function () {
            var d = document,
              s = d.createElement("script");
            s.src = "https://workpace.disqus.com/embed.js";
            s.setAttribute("data-timestamp", +new Date());
            (d.head || d.body).appendChild(s);
          })();
        </script>
        <noscript
          >Please enable JavaScript to view the
          <a href="https://disqus.com/?ref_noscript"
            >comments powered by Disqus.</a
          ></noscript
        >
      </div>
    </div>

    <footer class="py-6 bg-gray-800 text-center">
      <p class="text-gray-400">
        &copy; 2025 raflyasliGalek. All rights reserved.
      </p>
    </footer>

    <script src="./js/nokia-chiper-map.js"></script>
    <script src="./js/nokia-chiper-encrypt.js"></script>
    <script src="./js/nokia-chiper-decrypt.js"></script>
    <script src="./js/main.js"></script>
    <script src="./code/javascript.js"></script>

    <!-- Extended  -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </body>
</html>
